name: Build API bundle for Vercel

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/types.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig.json'
      - '.github/workflows/build-api.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production
        run: npm run build

      - name: Verify API bundle
        run: |
          test -s api/index.js
          node --check api/index.js
          grep -q "createApp" api/index.js || true

      - name: Commit generated Vercel function
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/index.js api/index.js.map dist/server.cjs dist/server.cjs.map
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "build: generate Vercel serverless API bundle"
            git push origin main
          fi
