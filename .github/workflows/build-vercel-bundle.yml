name: Build Vercel production bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/index.ts'
      - 'server/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Promote bundled API to Vercel entrypoint
        run: |
          test -s api/index.js
          rm -f api/index.ts api/index.js.map
          rm -f server/app.js server/app.js.map
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/index.js api/index.ts api/index.js.map server/app.js server/app.js.map
          git diff --cached --quiet || git commit -m "fix: deploy bundled Vercel serverless API"
          git push origin main
