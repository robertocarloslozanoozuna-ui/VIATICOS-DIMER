name: DIMER Final Lint Repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'final lint repair')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic TypeScript fixes
        shell: python
        run: |
          from pathlib import Path
          import re
          db=Path('server/db.ts')
          text=db.read_text(encoding='utf-8')
          if 'export function hasPermission(' not in text:
              text += "\nexport function hasPermission(user: User | null | undefined, permission: Permission): boolean {\n  if (!user || user.status === 'INACTIVO') return false;\n  if (user.role === 'ADMIN') return true;\n  return Boolean(user.permissions?.includes(permission));\n}\n"
              db.write_text(text,encoding='utf-8')
          app=Path('server/app.ts')
          text=app.read_text(encoding='utf-8')
          text=text.replace("||{id:'role_solicitante',name:'Solicitante'}", "||{id:'role_solicitante',name:'Solicitante',description:'',active:true,isSystem:true,permissions:['ver_solicitudes']}")
          text=text.replace("||{id:'role_solicitante',permissions:[]}", "||{id:'role_solicitante',name:'Solicitante',description:'',active:true,isSystem:true,permissions:[]}")
          text=re.sub(r'req\.params\.([A-Za-z_][A-Za-z0-9_]*)', r'String(req.params.\1)', text)
          app.write_text(text,encoding='utf-8')
      - name: Validate and commit
        shell: bash
        run: |
          set -e
          npm install
          npm run lint
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/db.ts server/app.ts
          git diff --cached --quiet || git commit -m "fix: final lint repair"
          git push
