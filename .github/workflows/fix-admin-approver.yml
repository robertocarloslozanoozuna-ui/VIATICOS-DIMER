name: Fix admin approver selector
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair approver and email routing
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('src/components/SolicitarView.tsx')
          s=p.read_text(encoding='utf-8')
          old="&&String(u.email||'').trim().toLowerCase()!=='sistemas@dimer.com.mx'"
          if old in s:
              s=s.replace(old,'',1)
          p.write_text(s,encoding='utf-8')

          p=Path('server/app.ts')
          s=p.read_text(encoding='utf-8')
          old="if(approverEmail==='sistemas@dimer.com.mx'){notificationErrors.push('Sistemas no es un aprobador válido para solicitudes de viáticos. Seleccione al jefe o líder correspondiente.');}else if(!created.approvalToken){"
          if old in s:
              s=s.replace(old,"if(!created.approvalToken){",1)
          old="const sistemasEmail = 'sistemas@dimer.com.mx';\n  const html = buildRejectionEmailHtml"
          if old in s:
              s=s.replace(old,"const html = buildRejectionEmailHtml",1)
          old="  if (sistemasEmail !== requesterEmail) targets.push({ to: sistemasEmail, subject: `SOLICITUD RECHAZADA - Folio ${r.folio} [SISTEMAS]`, role: 'Sistemas' });\n"
          if old in s:
              s=s.replace(old,'',1)
          p.write_text(s,encoding='utf-8')

          p=Path('server/mailService.ts')
          s=p.read_text(encoding='utf-8')
          sig="export async function sendEmail(p:{to:string;subject:string;html:string;from?:string;replyTo?:string;requestId?:string;folio?:string}):Promise<{success:boolean;logId:string;status:'ENVIADO'|'SIMULADO'|'FALLIDO';error?:string}>"
          if "from './emailIdempotency.js'" not in s:
              s=s.replace("import { recordAuditLog } from './db.js';", "import { recordAuditLog } from './db.js';\nimport { buildEmailDeliveryKey, reserveEmailDelivery, markEmailDeliverySent, releaseEmailDelivery } from './emailIdempotency.js';",1)
          # Remove the non-durable process-local dedupe. It is unsafe on Vercel and can suppress legitimate retries.
          s=s.replace("\nconst recentEmailKeys=new Map<string,number>();\n", "\n")
          block_re=re.compile(r"\n  const emailKey=`\\$\\{String\\(p\\.requestId\\|\\|p\\.folio\\|\\|'\'\\)\\}\\|\\$\\{String\\(p\\.to\\|\\|'\'\\)\\.trim\\(\\)\\.toLowerCase\\(\\)\\}\\|\\$\\{String\\(p\\.subject\\|\\|'\'\\)\\}`;.*?\n  for\\(const \\[key,ts\\] of recentEmailKeys\\)\\{if\\(now-ts>300000\\)recentEmailKeys.delete\\(key\\);\\}\n", re.S)
          s=block_re.sub("\n",s,1)
          # Also handle the exact compact block if regex above does not match.
          marker="  const emailKey=`${String(p.requestId||p.folio||'')}|${String(p.to||'').trim().toLowerCase()}|${String(p.subject||'')}`;"
          if marker in s:
              a=s.find(marker)
              b=s.find("  const logId=`MAIL-",a)
              if b>a: s=s[:a]+s[b:]
          # Reserve immediately before SMTP delivery; the DB primary key makes this atomic across Vercel instances.
          send_marker="      const sendResult=await transporter.sendMail({"
          if "reserveEmailDelivery({key:emailDeliveryKey" not in s and send_marker in s:
              reservation="      const emailDeliveryKey=buildEmailDeliveryKey(p.requestId,p.to,p.subject);\n      let emailDeliveryReserved=false;\n      try{\n        emailDeliveryReserved=await reserveEmailDelivery({key:emailDeliveryKey,requestId:p.requestId,folio:p.folio,recipient:p.to,subject:p.subject});\n      }catch(idempotencyErr:any){\n        console.error('[EMAIL-IDEMPOTENCY] Error reservando correo:',idempotencyErr);\n        status='FALLIDO';\n        errorMsg=idempotencyErr?.message||'No se pudo reservar la entrega del correo';\n        emailDeliveryReserved=false;\n      }\n      if(!emailDeliveryReserved){\n        const duplicateLogId=`MAIL-DEDUPE-${Date.now()}-${Math.floor(Math.random()*100000)}`;\n        console.warn(`[EMAIL-IDEMPOTENCY] Correo duplicado suprimido: ${p.to} | ${p.subject}`);\n        return {success:true,logId:duplicateLogId,status:'ENVIADO'};\n      }\n\n"
              s=s.replace(send_marker,reservation+send_marker,1)
          # Mark successful SMTP delivery as sent in the durable ledger.
          success_marker="      console.log(`[SMTP-DEBUG] Correo enviado exitosamente a ${p.to} (${logId}): ${sendResult.response||sendResult.messageId}`);"
          if "markEmailDeliverySent(emailDeliveryKey)" not in s and success_marker in s:
              s=s.replace(success_marker,success_marker+"\n      await markEmailDeliverySent(emailDeliveryKey);",1)
          # Release the reservation when SMTP itself fails so a later retry can send it.
          catch_marker="      console.error(`[SMTP-DEBUG-ERROR] Falló envío a ${p.to}: message=\"${e?.message}\", code=\"${e?.code}\", response=\"${e?.response}\", responseCode=\"${e?.responseCode}\"`);"
          if "releaseEmailDelivery(emailDeliveryKey)" not in s and catch_marker in s:
              s=s.replace(catch_marker,catch_marker+"\n      await releaseEmailDelivery(emailDeliveryKey);",1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          if ! git diff --quiet -- src/components/SolicitarView.tsx server/app.ts server/mailService.ts; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/components/SolicitarView.tsx server/app.ts server/mailService.ts
            git commit -m 'fix: corregir bloque sendEmail y deduplicacion persistente'
            git push
          fi
