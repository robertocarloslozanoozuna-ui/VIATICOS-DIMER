name: Fix admin approver selector
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair approver and email routing
        shell: python
        run: |
          from pathlib import Path

          p=Path('src/components/SolicitarView.tsx')
          s=p.read_text(encoding='utf-8')
          old="&&String(u.email||'').trim().toLowerCase()!=='sistemas@dimer.com.mx'"
          if old in s:
              s=s.replace(old,'',1)
          p.write_text(s,encoding='utf-8')

          p=Path('server/app.ts')
          s=p.read_text(encoding='utf-8')
          old="if(approverEmail==='sistemas@dimer.com.mx'){notificationErrors.push('Sistemas no es un aprobador válido para solicitudes de viáticos. Seleccione al jefe o líder correspondiente.');}else if(!created.approvalToken){"
          if old in s:
              s=s.replace(old,"if(!created.approvalToken){",1)

          old="const sistemasEmail = 'sistemas@dimer.com.mx';\n  const html = buildRejectionEmailHtml"
          if old in s:
              s=s.replace(old,"const html = buildRejectionEmailHtml",1)
          old="  if (sistemasEmail !== requesterEmail) targets.push({ to: sistemasEmail, subject: `SOLICITUD RECHAZADA - Folio ${r.folio} [SISTEMAS]`, role: 'Sistemas' });\n"
          if old in s:
              s=s.replace(old,'',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          if ! git diff --quiet -- src/components/SolicitarView.tsx server/app.ts; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/components/SolicitarView.tsx server/app.ts
            git commit -m 'fix: corregir aprobador administrador y destinatarios de correo'
            git push
          fi
