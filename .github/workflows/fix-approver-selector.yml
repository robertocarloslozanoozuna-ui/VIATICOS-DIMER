name: Fix approver selector
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-approver-selector.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch approver selector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/components/SolicitarView.tsx')
          s=p.read_text()
          old=re.search(r"const users=Array\.isArray\(data\?\.allUsers\)\?data\.allUsers:\[\];const approvers:Boss\[\]=users\.filter\(\(u:User\)=>\{.*?\}\)\.map\(\(u:User\)=>\(\{id:u\.id,name:u\.name,email:u\.email,department:u\.department\|\|'',active:true,createdAt:u\.createdAt\}\)\);setBosses\(approvers\);if\(approvers\.length\)\{const first=approvers\[0\];setSelectedBossId\(first\.id\);setBossEmail\(first\.email\);setBossName\(first\.name\);\}\}", s)
          if not old:
              raise SystemExit('Current approver selector block not found; refusing to modify')
          new="const users=Array.isArray(data?.allUsers)?data.allUsers:[];const approvers:Boss[]=users.filter((u:User)=>{const status=String(u.status||'').trim().toUpperCase();const role=String(u.role||'').trim().toUpperCase();const roleNames=Array.isArray(u.roles)?u.roles.map((r:any)=>String(r?.name||'').trim().toUpperCase()):[];const roleIds=Array.isArray(u.roleIds)?u.roleIds.map((id:any)=>String(id||'').trim().toLowerCase()):[];const permissions=Array.isArray(u.permissions)?u.permissions.map((p:any)=>String(p||'').trim().toLowerCase()):[];const normalizedRoles=[role,...roleNames].map(r=>r.normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/\\s+/g,' ').trim());const isJefe=normalizedRoles.includes('JEFE')||normalizedRoles.includes('JEFE APROBADOR')||normalizedRoles.some(r=>r.includes('JEFE')&&r.includes('APROB'))||roleIds.includes('role_jefe')||permissions.includes('aprobar_solicitudes');return (status==='ACTIVO'||status==='ACTIVE')&&isJefe&&String(u.email||'').trim().toLowerCase()!=='sistemas@dimer.com.mx';}).map((u:User)=>({id:u.id,name:u.name,email:u.email,department:u.department||'',active:true,createdAt:u.createdAt}));setBosses(approvers);if(approvers.length){const current=approvers.find(b=>b.id===selectedBossId)||approvers[0];setSelectedBossId(current.id);setBossEmail(current.email);setBossName(current.name);}}"
          p.write_text(s[:old.start()]+new+s[old.end():])
          PY
      - name: Verify build-critical selector
        run: |
          grep -q "allUsers" src/components/SolicitarView.tsx
          grep -q "JEFE APROBADOR" src/components/SolicitarView.tsx
          grep -q "aprobar_solicitudes" src/components/SolicitarView.tsx
          grep -q "sistemas@dimer.com.mx" src/components/SolicitarView.tsx
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/SolicitarView.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore approver selector from jefe role'
          git push