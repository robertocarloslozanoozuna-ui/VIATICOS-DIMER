name: Fix role-based approver selector
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch approver selector
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/SolicitarView.tsx')
          s=p.read_text()
          old="import type { User, TravelRequest, Boss, Department } from '../types';"
          new="import type { User, TravelRequest, Boss, Department } from '../types';"
          if old not in s:
              raise SystemExit('import anchor not found')
          old_effect="fetch('/api/bosses').then(r=>r.json()).then((data: Boss[])=>{const active=data.filter(b=>b.active&&String(b.email||'').trim().toLowerCase()!=='sistemas@dimer.com.mx');setBosses(active);if(active.length){const first=active[0];setSelectedBossId(first.id);setBossEmail(first.email);setBossName(first.name);}}).catch(err=>console.error('Error cargando jefes:',err));"
          new_effect="fetch('/api/me').then(r=>r.json()).then((data:any)=>{const users=Array.isArray(data?.allUsers)?data.allUsers:[];const approvers:Boss[]=users.filter((u:User)=>{const role=String(u.role||'').trim().toUpperCase();const roleNames=Array.isArray(u.roles)?u.roles.map((r:any)=>String(r?.name||'').trim().toUpperCase()):[];const roleIds=Array.isArray(u.roleIds)?u.roleIds.map((id:any)=>String(id||'').trim().toLowerCase()):[];const permissions=Array.isArray(u.permissions)?u.permissions.map((p:any)=>String(p||'').trim()):[];const isJefe=role==='JEFE'||roleNames.includes('JEFE')||roleNames.includes('JEFE APROBADOR')||roleIds.includes('role_jefe')||permissions.includes('aprobar_solicitudes');return u.status==='ACTIVO'&&isJefe&&String(u.email||'').trim().toLowerCase()!=='sistemas@dimer.com.mx';}).map((u:User)=>({id:u.id,name:u.name,email:u.email,department:u.department||'',active:true,createdAt:u.createdAt}));setBosses(approvers);if(approvers.length){const first=approvers[0];setSelectedBossId(first.id);setBossEmail(first.email);setBossName(first.name);}}).catch(err=>console.error('Error cargando jefes aprobadores:',err));"
          if old_effect not in s:
              raise SystemExit('approver effect anchor not found')
          s=s.replace(old_effect,new_effect,1)
          p.write_text(s)
          PY
      - name: Validate and commit
        shell: bash
        run: |
          grep -q "fetch('/api/me')" src/components/SolicitarView.tsx
          grep -q "JEFE APROBADOR" src/components/SolicitarView.tsx
          npm ci
          npm run lint
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/SolicitarView.tsx
          if git diff --cached --quiet; then echo 'No source changes to commit'; else git commit -m 'fix: show active users with approver role in request selector'; git push; fi
      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/fix-approver-selector.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary approver fix workflow' || true
          git push || true
