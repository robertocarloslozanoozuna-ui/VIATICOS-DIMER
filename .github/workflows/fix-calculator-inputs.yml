name: Fix calculator inputs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch calculator inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/SolicitarView.tsx')
          s = p.read_text()

          replacements = {
            "const [calcHotel, setCalcHotel] = useState(6000);": "const [calcHotel, setCalcHotel] = useState('6000');",
            "const [calcTransport, setCalcTransport] = useState(5000);": "const [calcTransport, setCalcTransport] = useState('5000');",
            "const [calcFood, setCalcFood] = useState(3000);": "const [calcFood, setCalcFood] = useState('3000');",
            "const [calcMisc, setCalcMisc] = useState(850);": "const [calcMisc, setCalcMisc] = useState('850');",
            "const applyCalculatorTotal=()=>{const total=(calcHotel||0)+(calcTransport||0)+(calcFood||0)+(calcMisc||0);setAmountRequested(String(total));const breakdownText=`Desglose estimado: Hospedaje ($${calcHotel}), Transporte ($${calcTransport}), Alimentos ($${calcFood}), Imprevistos/Taxis ($${calcMisc}).`;setComments(prev=>prev?`${prev}\\n${breakdownText}`:breakdownText);setShowCalculator(false);};": "const applyCalculatorTotal=()=>{const total=Number(calcHotel||0)+Number(calcTransport||0)+Number(calcFood||0)+Number(calcMisc||0);setAmountRequested(String(total));const breakdownText=`Desglose estimado: Hospedaje ($${Number(calcHotel||0)}), Transporte ($${Number(calcTransport||0)}), Alimentos ($${Number(calcFood||0)}), Imprevistos/Taxis ($${Number(calcMisc||0)}).`;setComments(prev=>prev?`${prev}\\n${breakdownText}`:breakdownText);setShowCalculator(false);};",
            "transportCost:isTravelType?calcTransport:0,hotelCost:isTravelType?calcHotel:0,foodCost:isTravelType?calcFood:0,miscCost:isTravelType?calcMisc:0": "transportCost:isTravelType?Number(calcTransport||0):0,hotelCost:isTravelType?Number(calcHotel||0):0,foodCost:isTravelType?Number(calcFood||0):0,miscCost:isTravelType?Number(calcMisc||0):0",
            "onChange={e=>setCalcHotel(Number(e.target.value))}": "onChange={e=>setCalcHotel(e.target.value)}",
            "onChange={e=>setCalcTransport(Number(e.target.value))}": "onChange={e=>setCalcTransport(e.target.value)}",
            "onChange={e=>setCalcFood(Number(e.target.value))}": "onChange={e=>setCalcFood(e.target.value)}",
            "onChange={e=>setCalcMisc(Number(e.target.value))}": "onChange={e=>setCalcMisc(e.target.value)}",
          }

          for old, new in replacements.items():
              if old not in s:
                  if old.startswith('const [calc') or old.startswith('transportCost:') or old.startswith('onChange='):
                      raise SystemExit(f'Expected pattern not found: {old}')
              s = s.replace(old, new)

          p.write_text(s)
          PY

      - name: Verify
        run: |
          grep -n "calcHotel\|calcTransport\|calcFood\|calcMisc" src/components/SolicitarView.tsx

      - name: Commit patch and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SolicitarView.tsx
          git rm .github/workflows/fix-calculator-inputs.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: allow clearing calculator amounts without leading zeros"
          git push
