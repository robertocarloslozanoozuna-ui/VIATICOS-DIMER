name: Fix login DB resilience

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch role lookups and login audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('server/db.ts')
          s = p.read_text(encoding='utf-8')

          old1 = "async function getUserRoleIds(userId:string,fallbackRoleId?:string){const {data,error}=await supabase.from('user_roles').select('role_id').eq('user_id',userId);if(error)throw error;const ids=(data||[]).map((r:any)=>String(r.role_id)).filter(Boolean);return ids.length?Array.from(new Set(ids)):(fallbackRoleId?[fallbackRoleId]:[]);}"
          new1 = "async function getUserRoleIds(userId:string,fallbackRoleId?:string){try{const {data,error}=await supabase.from('user_roles').select('role_id').eq('user_id',userId);if(error){console.error('[ROLE-LOOKUP] user_roles:',error);return fallbackRoleId?[fallbackRoleId]:[];}const ids=(data||[]).map((r:any)=>String(r.role_id)).filter(Boolean);return ids.length?Array.from(new Set(ids)):(fallbackRoleId?[fallbackRoleId]:[]);}catch(error){console.error('[ROLE-LOOKUP] user_roles exception:',error);return fallbackRoleId?[fallbackRoleId]:[];}}"
          old2 = "async function getRolesByIds(ids:string[]){if(!ids.length)return [] as RoleDefinition[];const {data,error}=await supabase.from('roles').select('*').in('id',ids);if(error)throw error;return (data||[]).map(toRole);}"
          new2 = "async function getRolesByIds(ids:string[]){if(!ids.length)return [] as RoleDefinition[];try{const {data,error}=await supabase.from('roles').select('*').in('id',ids);if(error){console.error('[ROLE-LOOKUP] roles:',error);return [];}return (data||[]).map(toRole);}catch(error){console.error('[ROLE-LOOKUP] roles exception:',error);return [];}}"

          if old1 not in s:
              raise SystemExit('No se encontró getUserRoleIds; se cancela para evitar una modificación insegura.')
          if old2 not in s:
              raise SystemExit('No se encontró getRolesByIds; se cancela para evitar una modificación insegura.')

          s = s.replace(old1,new1,1).replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          p = Path('server/app.ts')
          s = p.read_text(encoding='utf-8')
          old = "await recordAuditLog({userId:u.id,action:'INICIO_SESION',details:{email:u.email,role:u.role}});res.json({success:true,user:u,token});"
          new = "try{await recordAuditLog({userId:u.id,action:'INICIO_SESION',details:{email:u.email,role:u.role}});}catch(auditError){console.error('[LOGIN-AUDIT-ERROR]',auditError);}res.json({success:true,user:u,token});"
          if old not in s:
              raise SystemExit('No se encontró el cierre de login esperado; se cancela para evitar una modificación insegura.')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

          rm -f .github/workflows/fix-admin-login.yml .github/workflows/repair-login-now.yml .github/workflows/fix-login-db-now.yml

          npm ci
          npm run lint
          npm run build

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/db.ts server/app.ts .github/workflows/fix-admin-login.yml .github/workflows/repair-login-now.yml .github/workflows/fix-login-db-now.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make authentication resilient to optional role data failures'
          git push origin main
