name: Fix login object error

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-login:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login error normalization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/utils/apiHelper.ts')
          s=p.read_text()
          old="""  if (!res.ok) {\n    const errorMsg = parsedData?.error || parsedData?.message || `Error en la solicitud (${res.status})`;\n    throw new Error(errorMsg);\n  }\n"""
          new="""  if (!res.ok) {\n    const rawError = parsedData?.error ?? parsedData?.message;\n    const errorMsg = typeof rawError === 'string'\n      ? rawError\n      : rawError && typeof rawError === 'object'\n        ? String(rawError.message || rawError.error_description || rawError.error || rawError.details || rawError.hint || `Error en la solicitud (${res.status})`)\n        : `Error en la solicitud (${res.status})`;\n    throw new Error(errorMsg);\n  }\n"""
          if old not in s: raise SystemExit('apiHelper target not found')
          p.write_text(s.replace(old,new,1))

          p=Path('server/app.ts')
          s=p.read_text()
          old="function err(res:express.Response,e:unknown){const msg=e instanceof Error?e.message:'Error interno';const status=/JWT|autentic|token inválido|no se encontró/i.test(msg)?400:503;return res.status(status).json({success:false,error:msg});}"
          new="""function err(res:express.Response,e:unknown){const msg=e instanceof Error?e.message:typeof e==='string'?e:e&&typeof e==='object'?String((e as any).message||(e as any).error_description||(e as any).error||(e as any).details||(e as any).hint||'Error interno'):'Error interno';console.error('[API-ERROR]',e);const status=/JWT|autentic|token inválido|no se encontró/i.test(msg)?400:503;return res.status(status).json({success:false,error:msg});}"""
          if old not in s: raise SystemExit('app error helper target not found')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Verify and commit source fix
        run: |
          grep -n "rawError" src/utils/apiHelper.ts
          grep -n "API-ERROR" server/app.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/apiHelper.ts server/app.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: normalize API errors instead of showing object object"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-login-object-error.yml
          git commit -m "chore: remove temporary login fix workflow"
          git push
