name: Repair multi-role branch

on:
  push:
    branches: [feat/multi-role-admin-ui]
    paths:
      - '.github/workflows/fix-multi-role.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair RBAC and Admin UI
        shell: python
        run: |
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              out = fn(s)
              if out == s:
                  print(f'No textual change required: {path}')
              else:
                  p.write_text(out, encoding='utf-8')
                  print(f'Updated: {path}')

          # securityGate must resolve the complete role catalog so permissions from
          # every assigned role are available on protected requests.
          def security(s):
              old = "return sanitizeUser(u,roles.find(r=>r.id===u.roleId));"
              new = "return sanitizeUser(u,roles,roles);"
              if old not in s:
                  if "return sanitizeUser(u,roles,roles);" in s:
                      return s
                  raise SystemExit('securityGate.ts: expected currentUser sanitize anchor not found')
              return s.replace(old, new, 1)
          edit('server/securityGate.ts', security)

          # Admin UI: keep roleId as primary/legacy role, while allowing any number
          # of additional roles through roleIds. The backend already persists them.
          def admin(s):
              if "const [userRoleIds, setUserRoleIds]" not in s:
                  anchor = "  const [userRoleId, setUserRoleId] = useState('role_empleado');"
                  if anchor not in s:
                      raise SystemExit('AdminView.tsx: role state anchor not found')
                  s = s.replace(anchor, anchor + "\n  const [userRoleIds, setUserRoleIds] = useState<string[]>(['role_empleado']);", 1)

              s = s.replace(
                  "setUserRoleId(rolesList[3]?.id || 'role_empleado');\n    setUserStatus('ACTIVO');",
                  "setUserRoleId(rolesList[3]?.id || 'role_empleado');\n    setUserRoleIds([rolesList[3]?.id || 'role_empleado']);\n    setUserStatus('ACTIVO');",
                  1
              )

              old_edit = "setUserRoleId(user.roleId || (rolesList.find(r => r.name.toUpperCase() === String(user.role).toUpperCase())?.id || 'role_empleado'));\n    setUserStatus"
              new_edit = "const assignedRoleIds = user.roleIds?.length ? user.roleIds : [user.roleId || (rolesList.find(r => r.name.toUpperCase() === String(user.role).toUpperCase())?.id || 'role_empleado')];\n    setUserRoleIds(assignedRoleIds);\n    setUserRoleId(assignedRoleIds[0]);\n    setUserStatus"
              if old_edit in s:
                  s = s.replace(old_edit, new_edit, 1)
              elif "const assignedRoleIds = user.roleIds?.length" not in s:
                  raise SystemExit('AdminView.tsx: edit-user role anchor not found')

              s = s.replace(
                  "roleId: userRoleId,\n            status: userStatus,",
                  "roleId: userRoleIds[0] || userRoleId,\n            roleIds: userRoleIds,\n            status: userStatus,"
              )

              # Add a multi-select role panel immediately before the Estado field.
              role_panel = '''                  <div className="mt-2 rounded-md border border-indigo-100 bg-indigo-50/40 p-2">
                    <div className="flex items-center justify-between mb-1.5">
                      <span className="text-[10px] font-bold text-slate-600 uppercase">Roles adicionales</span>
                      <span className="text-[10px] text-indigo-600 font-semibold">{userRoleIds.length} seleccionado(s)</span>
                    </div>
                    <div className="max-h-32 overflow-y-auto space-y-1">
                      {rolesList.map((r) => {
                        const checked = userRoleIds.includes(r.id);
                        return (
                          <label key={r.id} className="flex items-center gap-2 cursor-pointer rounded px-1.5 py-1 hover:bg-white">
                            <input
                              type="checkbox"
                              checked={checked}
                              onChange={() => {
                                setUserRoleIds(prev => checked ? prev.filter(id => id !== r.id) : [...prev, r.id]);
                              }}
                              className="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
                            />
                            <span className="text-[11px] text-slate-700">{r.name}</span>
                          </label>
                        );
                      })}
                    </div>
                  </div>
'''
              if "Roles adicionales" not in s:
                  marker = '''                <div>
                  <label className="block font-bold text-slate-700 mb-1">Estado *</label>'''
                  if marker not in s:
                      raise SystemExit('AdminView.tsx: Estado field anchor not found')
                  s = s.replace(marker, role_panel + marker, 1)

              # Never allow an empty role assignment; keep the visible legacy selector
              # as the primary role while the checkboxes control the complete set.
              s = s.replace(
                  "value={userRoleId}\n                    onChange={(e) => setUserRoleId(e.target.value)}",
                  "value={userRoleId}\n                    onChange={(e) => { const id = e.target.value; setUserRoleId(id); setUserRoleIds(prev => prev.includes(id) ? prev : [id, ...prev]); }}"
              )

              # Show all assigned role names in the user table.
              s = s.replace("<th className=\"py-2.5 px-3\">Rol Asignado</th>", "<th className=\"py-2.5 px-3\">Roles Asignados</th>")
              s = s.replace("{user.role}\n                      </span>", "{(user.roleIds?.length ? user.roleIds : [user.roleId]).map((id) => rolesList.find(r => r.id === id)?.name || id).filter(Boolean).join(' • ')}\n                      </span>", 1)

              # New-user payload may have been missed by a prior partial patch.
              s = s.replace(
                  "department: finalDept,\n            roleId: userRoleId,\n            status: userStatus,",
                  "department: finalDept,\n            roleId: userRoleIds[0] || userRoleId,\n            roleIds: userRoleIds,\n            status: userStatus,"
              )
              return s
          edit('src/components/AdminView.tsx', admin)

          # Verify backend invariants before compiling.
          db = Path('server/db.ts').read_text(encoding='utf-8')
          app = Path('server/app.ts').read_text(encoding='utf-8')
          sec = Path('server/securityGate.ts').read_text(encoding='utf-8')
          ui = Path('src/components/AdminView.tsx').read_text(encoding='utf-8')
          required = [
              ('server/db.ts', 'roleIds'),
              ('server/db.ts', 'user_roles'),
              ('server/app.ts', 'roleIds'),
              ('server/securityGate.ts', 'sanitizeUser(u,roles,roles)'),
              ('src/components/AdminView.tsx', 'userRoleIds'),
              ('src/components/AdminView.tsx', 'roleIds: userRoleIds'),
              ('src/components/AdminView.tsx', 'Roles adicionales'),
          ]
          blobs = {'server/db.ts':db,'server/app.ts':app,'server/securityGate.ts':sec,'src/components/AdminView.tsx':ui}
          for file, needle in required:
              if needle not in blobs[file]:
                  raise SystemExit(f'Invariant failed: {file} missing {needle}')

      - name: Install dependencies
        run: npm ci

      - name: TypeScript lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit repaired branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/securityGate.ts src/components/AdminView.tsx api/index.js
          git commit -m 'fix: complete multi-role admin flow and verify build'
          git push origin feat/multi-role-admin-ui
