name: Fix notification recipients
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-notification-recipients.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch recipients
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('server/app.ts')
          s = p.read_text()
          old = "  const sistemasEmail = 'sistemas@dimer.com.mx';\n  const html = buildSystemsApprovedEmailHtml({ request: r, user, approverName, approverEmail, approvedAt });"
          new = "  const html = buildSystemsApprovedEmailHtml({ request: r, user, approverName, approverEmail, approvedAt });"
          if old not in s:
              raise SystemExit('server/app.ts: approval systems declaration not found')
          s = s.replace(old, new, 1)
          old = "  if (sistemasEmail !== requesterEmail && sistemasEmail !== finanzasEmail) targets.push({ to: sistemasEmail, subject: `SOLICITUD DE VIÁTICOS APROBADA - Folio ${r.folio} [SISTEMAS]`, role: 'Sistemas' });\n"
          if old not in s:
              raise SystemExit('server/app.ts: approval systems recipient not found')
          s = s.replace(old, '', 1)
          p.write_text(s)

          p = Path('src/components/SolicitarView.tsx')
          s = p.read_text()
          replacements = [
            ("const [selectedBossId, setSelectedBossId] = useState<string>('boss_003');", "const [selectedBossId, setSelectedBossId] = useState<string>('');"),
            ("const [bossEmail, setBossEmail] = useState('sistemas@dimer.com.mx');", "const [bossEmail, setBossEmail] = useState('');"),
            ("const [bossName, setBossName] = useState('Ing. Roberto Flores / Autorizaciones TI');", "const [bossName, setBossName] = useState('');"),
            ("correo_autorizacion:'sistemas@dimer.com.mx'", "correo_autorizacion:bossEmail.trim()"),
            ("Se envió la solicitud a <strong>{successResult.request.bossEmail}</strong> y se notificó a <strong>sistemas@dimer.com.mx</strong>.", "Se envió la solicitud a <strong>{successResult.request.bossEmail}</strong> para autorización. El resultado de la autorización se notificará únicamente al solicitante y a Finanzas.")
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'src/components/SolicitarView.tsx: text not found: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify no unwanted approval recipient
        run: |
          ! grep -n "sistemasEmail.*targets.push.*APROBADA" server/app.ts
          ! grep -n "correo_autorizacion:'sistemas@dimer.com.mx'" src/components/SolicitarView.tsx
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/app.ts src/components/SolicitarView.tsx .github/workflows/fix-notification-recipients.yml
          git commit -m 'fix: correct viatics email recipients' || exit 0
          git push
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/fix-notification-recipients.yml || true
          git commit -m 'chore: remove temporary notification fix workflow' || true
          git push || true
