name: Fix request creation route

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore existing request endpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/SolicitarView.tsx')
          s = p.read_text(encoding='utf-8')
          old = "safeFetchJson<any>('/api/requests/create'"
          new = "safeFetchJson<any>('/api/requests'"
          if old not in s:
              raise SystemExit('Expected request endpoint not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-request-route.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SolicitarView.tsx .github/workflows/fix-request-route.yml
          git commit -m "fix: restore request creation endpoint"
          git push