name: Implement multi-role admin support (review branch)

on:
  push:
    branches: [feat/multi-role-admin-ui]
    paths:
      - '.github/workflows/implement-multi-role-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply backward-compatible multi-role changes
        shell: python
        run: |
          from pathlib import Path
          import re

          # ---------------- types.ts ----------------
          p = Path('src/types.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace("  roleId?: string;\n  permissions?: Permission[];", "  roleId?: string;\n  /** All role IDs assigned to this user. roleId remains the primary/legacy role. */\n  roleIds?: string[];\n  permissions?: Permission[];")
          p.write_text(s, encoding='utf-8')

          # ---------------- db.ts ----------------
          p = Path('server/db.ts')
          s = p.read_text(encoding='utf-8')
          old = "const toUser=(r:any):StoredUserRecord=>({id:r.id,name:r.name,email:r.email,role:r.role,roleId:r.role_id||undefined,department:r.department||'',status:r.status,isVerified:r.is_verified,passwordHash:r.password_hash,salt:r.salt,createdAt:r.created_at,avatar:r.avatar});"
          new = "const toUser=(r:any):StoredUserRecord=>({id:r.id,name:r.name,email:r.email,role:r.role,roleId:r.role_id||undefined,roleIds:Array.isArray(r.role_ids)?r.role_ids:(r.role_id?[String(r.role_id)]:[]),department:r.department||'',status:r.status,isVerified:r.is_verified,passwordHash:r.password_hash,salt:r.salt,createdAt:r.created_at,avatar:r.avatar});"
          if old not in s: raise SystemExit('db.ts: toUser anchor not found')
          s = s.replace(old, new, 1)

          old = "export function sanitizeUser(u:StoredUserRecord,role?:RoleDefinition):User{const roleId=u.roleId||(u.role==='ADMIN'?'role_admin':u.role==='JEFE'?'role_jefe':u.role==='FINANZAS'?'role_finanzas':u.role==='SOLO_LECTURA_APROBADAS'?'role_solo_lectura':'role_solicitante');const perms=role?.permissions||[];return {id:u.id,name:u.name,email:u.email,department:u.department||'',role:u.role,roleId,permissions:u.role==='ADMIN'?ALL_SYSTEM_PERMISSIONS.map(p=>p.id):perms,status:u.status,isVerified:u.isVerified??true,avatar:u.avatar,createdAt:u.createdAt};}"
          new = "export function sanitizeUser(u:StoredUserRecord,role?:RoleDefinition|RoleDefinition[],allRoles?:RoleDefinition[]):User{const roleId=u.roleId||(u.role==='ADMIN'?'role_admin':u.role==='JEFE'?'role_jefe':u.role==='FINANZAS'?'role_finanzas':u.role==='SOLO_LECTURA_APROBADAS'?'role_solo_lectura':'role_solicitante');const roleIds=Array.from(new Set((u.roleIds&&u.roleIds.length?u.roleIds:[roleId]).filter(Boolean)));const defs=Array.isArray(role)?role:(role?[role]:[]);const catalog=allRoles||defs;const perms=u.role==='ADMIN'?ALL_SYSTEM_PERMISSIONS.map(p=>p.id):Array.from(new Set(catalog.filter(r=>roleIds.includes(r.id)).flatMap(r=>r.permissions||[])));return {id:u.id,name:u.name,email:u.email,department:u.department||'',role:u.role,roleId,roleIds,permissions:perms,status:u.status,isVerified:u.isVerified??true,avatar:u.avatar,createdAt:u.createdAt};}"
          if old not in s: raise SystemExit('db.ts: sanitizeUser anchor not found')
          s = s.replace(old, new, 1)

          # Add junction helpers immediately before getUserById.
          anchor = "export async function getUserById(id:string){"
          helper = """async function getUserRoleIds(userId:string,legacyRoleId?:string){\n  try{const {data,error}=await supabase.from('user_roles').select('role_id').eq('user_id',userId);if(error)throw error;const ids=(data||[]).map((r:any)=>String(r.role_id)).filter(Boolean);return ids.length?Array.from(new Set(ids)):(legacyRoleId?[legacyRoleId]:[]);}catch{return legacyRoleId?[legacyRoleId]:[];}\n}\n\nasync function setUserRoleIds(userId:string,roleIds:string[]){\n  const ids=Array.from(new Set(roleIds.filter(Boolean)));\n  try{await supabase.from('user_roles').delete().eq('user_id',userId);if(ids.length){const {error}=await supabase.from('user_roles').insert(ids.map(role_id=>({user_id:userId,role_id})));if(error)throw error;}}catch(e){console.warn('[RBAC] user_roles unavailable; preserving legacy single role:',e);}\n}\n\n"""
          if anchor not in s: raise SystemExit('db.ts: getUserById anchor not found')
          s = s.replace(anchor, helper+anchor, 1)

          # Replace the four user persistence functions as a block.
          pattern = re.compile(r"export async function getUserById\(id:string\)\{.*?export async function deleteUser\(id:string\)\{", re.S)
          m = pattern.search(s)
          if not m: raise SystemExit('db.ts: user persistence block not found')
          block = r'''export async function getUserById(id:string){const {data,error}=await supabase.from('users').select('*').eq('id',id).maybeSingle();if(error)throw error;if(!data)return null;const u=toUser(data);u.roleIds=await getUserRoleIds(u.id,u.roleId);return u;}
export async function getUserByEmail(email:string){const {data,error}=await supabase.from('users').select('*').eq('email',email.trim().toLowerCase()).maybeSingle();if(error)throw error;if(!data)return null;const u=toUser(data);u.roleIds=await getUserRoleIds(u.id,u.roleId);return u;}
export async function listUsers(){const {data,error}=await supabase.from('users').select('*').order('created_at',{ascending:false});if(error)throw error;const roles=await listRoles();const users=(data||[]).map(toUser);let assignments:any[]=[];try{const ids=users.map(u=>u.id);if(ids.length){const q=await supabase.from('user_roles').select('user_id,role_id').in('user_id',ids);if(!q.error)assignments=q.data||[];}}catch{}const byUser=new Map<string,string[]>();for(const a of assignments){const arr=byUser.get(a.user_id)||[];arr.push(String(a.role_id));byUser.set(a.user_id,arr);}return users.map(u=>{u.roleIds=byUser.get(u.id)?.length?Array.from(new Set(byUser.get(u.id)!)):(u.roleId?[u.roleId]:[]);return sanitizeUser(u,roles,roles);});}
export async function insertUser(u:StoredUserRecord){const primary=u.roleId||u.roleIds?.[0]||'role_solicitante';const {data,error}=await supabase.from('users').insert({id:u.id,name:u.name,email:u.email.toLowerCase(),role:u.role,role_id:primary,department:u.department||'General',status:u.status,is_verified:u.isVerified??true,password_hash:u.passwordHash||'',salt:u.salt||'',created_at:u.createdAt||new Date().toISOString()}).select('*').single();if(error)throw error;await setUserRoleIds(u.id,u.roleIds?.length?u.roleIds:[primary]);const out=toUser(data);out.roleIds=u.roleIds?.length?u.roleIds:[primary];return out;}
export async function updateUser(id:string,p:Partial<StoredUserRecord>){const row:any={};for(const [k,v] of Object.entries(p)){const m:any={name:'name',email:'email',role:'role',roleId:'role_id',department:'department',status:'status',isVerified:'is_verified',passwordHash:'password_hash',salt:'salt'};if(m[k]!==undefined&&v!==undefined)row[m[k]]=k==='email'?String(v).toLowerCase():v;}if(Array.isArray(p.roleIds)&&p.roleIds.length){row.role_id=p.roleIds[0];}const {data,error}=await supabase.from('users').update(row).eq('id',id).select('*').single();if(error)throw error;if(Array.isArray(p.roleIds)&&p.roleIds.length)await setUserRoleIds(id,p.roleIds);const out=toUser(data);out.roleIds=Array.isArray(p.roleIds)&&p.roleIds.length?p.roleIds:await getUserRoleIds(id,out.roleId);return out;}
export async function deleteUser(id:string){const {error}=await supabase.from('users').delete().eq('id',id);if(error)throw error;}
'''
          s = s[:m.start()] + block + s[m.end():]

          # Existing call sites passing one role continue to work; enrich them with the complete catalog.
          s = s.replace("sanitizeUser(u,roles.find(r=>r.id===u.roleId))", "sanitizeUser(u,roles,roles)")
          s = s.replace("sanitizeUser(toUser(r),roles.find(x=>x.id===r.role_id))", "sanitizeUser(toUser(r),roles,roles)")
          p.write_text(s, encoding='utf-8')

          # ---------------- app.ts ----------------
          p = Path('server/app.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace("sanitizeUser(u,roles.find(r=>r.id===u.roleId))", "sanitizeUser(u,roles,roles)")
          # Login/verification/user creation: preserve roleId as primary and add all role IDs.
          s = s.replace("const role:Role=roleDef.id==='role_admin'?'ADMIN':roleDef.id==='role_jefe'?'JEFE':roleDef.id==='role_finanzas'?'FINANZAS':roleDef.id==='role_solo_lectura'?'SOLO_LECTURA_APROBADAS':'SOLICITANTE';const u=await (await import('./db.js')).insertUser({", "const requestedRoleIds=Array.from(new Set((Array.isArray(req.body?.roleIds)?req.body.roleIds:[roleDef.id]).map((x:any)=>String(x)).filter(Boolean)));const primaryRoleId=requestedRoleIds[0]||roleDef.id;const primaryDef=(await listRoles()).find(r=>r.id===primaryRoleId)||roleDef;const role:Role=primaryDef.id==='role_admin'?'ADMIN':primaryDef.id==='role_jefe'?'JEFE':primaryDef.id==='role_finanzas'?'FINANZAS':primaryDef.id==='role_solo_lectura'?'SOLO_LECTURA_APROBADAS':'SOLICITANTE';const u=await (await import('./db.js')).insertUser({")
          s = s.replace("role,roleId:roleDef.id,department:dept.name", "role,roleId:primaryRoleId,roleIds:requestedRoleIds,department:dept.name")
          s = s.replace("if(req.body.roleId)p.roleId=req.body.roleId;", "if(req.body.roleId)p.roleId=req.body.roleId;if(Array.isArray(req.body.roleIds))p.roleIds=Array.from(new Set(req.body.roleIds.map((x:any)=>String(x)).filter(Boolean)));else if(req.body.roleId)p.roleIds=[String(req.body.roleId)];")
          # Do not let the old roleId-only branch overwrite a multi-role primary when roleIds are supplied.
          s = s.replace("if(req.body.roleId){const rd=(await listRoles()).find(r=>r.id===req.body.roleId);p.role=rd?.id==='role_admin'?'ADMIN':rd?.id==='role_jefe'?'JEFE':rd?.id==='role_finanzas'?'FINANZAS':rd?.id==='role_solo_lectura'?'SOLO_LECTURA_APROBADAS':'SOLICITANTE';}", "if(req.body.roleId||Array.isArray(req.body.roleIds)){const rid=Array.isArray(req.body.roleIds)&&req.body.roleIds.length?String(req.body.roleIds[0]):String(req.body.roleId);const rd=(await listRoles()).find(r=>r.id===rid);p.roleId=rid;p.role=rd?.id==='role_admin'?'ADMIN':rd?.id==='role_jefe'?'JEFE':rd?.id==='role_finanzas'?'FINANZAS':rd?.id==='role_solo_lectura'?'SOLO_LECTURA_APROBADAS':'SOLICITANTE';}")
          # Admin users endpoint has the same role creation pattern; replace any remaining insert payload roleId occurrence.
          s = s.replace("role,roleId:roleDef.id,department:dept.name,status", "role,roleId:roleDef.id,roleIds:Array.isArray(req.body?.roleIds)&&req.body.roleIds.length?req.body.roleIds:[roleDef.id],department:dept.name,status")
          p.write_text(s, encoding='utf-8')

          # ---------------- AdminView.tsx ----------------
          p = Path('src/components/AdminView.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const [userRoleId, setUserRoleId] = useState('role_empleado');", "const [userRoleId, setUserRoleId] = useState('role_empleado');\n  const [userRoleIds, setUserRoleIds] = useState<string[]>(['role_empleado']);")
          s = s.replace("setUserRoleId(rolesList[3]?.id || 'role_empleado');\n    setUserStatus", "setUserRoleId(rolesList[3]?.id || 'role_empleado');\n    setUserRoleIds([rolesList[3]?.id || 'role_empleado']);\n    setUserStatus")
          s = s.replace("setUserRoleId(user.roleId || (rolesList.find(r => r.name.toUpperCase() === String(user.role).toUpperCase())?.id || 'role_empleado'));\n    setUserStatus", "const assigned = user.roleIds?.length ? user.roleIds : [user.roleId || (rolesList.find(r => r.name.toUpperCase() === String(user.role).toUpperCase())?.id || 'role_empleado')];\n    setUserRoleIds(assigned);\n    setUserRoleId(assigned[0]);\n    setUserStatus")
          s = s.replace("roleId: userRoleId,\n            status: userStatus,", "roleId: userRoleIds[0] || userRoleId,\n            roleIds: userRoleIds,\n            status: userStatus,")
          s = s.replace("roleId: userRoleId,\n            status: userStatus,", "roleId: userRoleIds[0] || userRoleId,\n            roleIds: userRoleIds,\n            status: userStatus,")
          old = '''<div>\n                  <label className="block font-bold text-slate-700 mb-1">Rol Asignado *</label>\n                  <select\n                    value={userRoleId}\n                    onChange={(e) => setUserRoleId(e.target.value)}\n                    className="w-full px-3 py-1.5 border border-slate-300 rounded-md focus:ring-1 focus:ring-indigo-500 focus:outline-none bg-white"\n                  >\n                    {rolesList.map((r) => (\n                      <option key={r.id} value={r.id}>\n                        {r.name}\n                      </option>\n                    ))}\n                  </select>\n                </div>'''
          new = '''<div>\n                  <label className="block font-bold text-slate-700 mb-1">Roles Asignados *</label>\n                  <div className="max-h-32 overflow-y-auto border border-slate-300 rounded-md p-2 bg-slate-50 space-y-1">\n                    {rolesList.map((r) => {\n                      const checked = userRoleIds.includes(r.id);\n                      return (\n                        <label key={r.id} className={`flex items-center gap-2 px-2 py-1 rounded cursor-pointer ${checked ? 'bg-indigo-50 border border-indigo-200' : 'hover:bg-white'}`}>\n                          <input type="checkbox" checked={checked} onChange={() => {\n                            const next = checked ? userRoleIds.filter(id => id !== r.id) : [...userRoleIds, r.id];\n                            if (!next.length) return;\n                            setUserRoleIds(next);\n                            setUserRoleId(next[0]);\n                          }} className="rounded text-indigo-600 focus:ring-indigo-500" />\n                          <span className="text-[11px] font-semibold text-slate-800">{r.name}</span>\n                        </label>\n                      );\n                    })}\n                  </div>\n                  <span className="text-[10px] text-slate-500">Puede asignar varios roles. Los permisos se combinan.</span>\n                </div>'''
          if old not in s: raise SystemExit('AdminView.tsx: role selector anchor not found')
          s = s.replace(old, new, 1)
          # Show all assigned role names in the table when available.
          s = s.replace("{user.role}\n                      </span>", "{(user.roleIds?.length ? user.roleIds : [user.roleId]).map(id => rolesList.find(r => r.id === id)?.name || (id === user.roleId ? user.role : id)).join(' + ')}\n                      </span>")
          p.write_text(s, encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/implement-multi-role-review.yml
          git add src/types.ts server/db.ts server/app.ts src/components/AdminView.tsx supabase/20260831_user_multi_roles.sql
          git commit -m "feat: support multiple roles per user" || exit 0
          git push origin HEAD:feat/multi-role-admin-ui
