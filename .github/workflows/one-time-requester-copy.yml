name: One-time requester approval copy patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch approval email copy
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('server/mailService.ts')
          text = path.read_text(encoding='utf-8')

          if 'DIMER_APPROVAL_REQUESTER_COPY_V1' in text:
              print('Patch already present; nothing to do.')
              raise SystemExit(0)

          old_import = "import type { TravelRequest, User, EmailLog } from '../src/types';"
          new_import = old_import + "\nimport { USERS } from './db';"
          if old_import not in text:
              raise SystemExit('Expected mailService import block not found')
          text = text.replace(old_import, new_import, 1)

          marker = "  const effectiveReplyTo = replyTo || (process.env.SMTP_REPLY_TO?.trim()) || undefined;"
          addition = marker + r'''

  // DIMER_APPROVAL_REQUESTER_COPY_V1:
  // For approval notifications, send exactly one copy to the requester.
  // The copy is attached to the Systems notification only, avoiding duplicates
  // when the requester is Systems or Finance.
  let requesterApprovalCopy: string | undefined;
  const isApprovalNotification = /SOLICITUD DE VIÁTICOS APROBADA/i.test(subject);
  if (isApprovalNotification && requestId && to.trim().toLowerCase() === 'sistemas@dimer.com.mx') {
    const requester = USERS.find(u => u.id === requestId);
    const requesterEmail = requester?.email?.trim().toLowerCase();
    const financeEmail = (process.env.FINANZAS_EMAIL || 'finanzas@dimer.com.mx').trim().toLowerCase();
    if (
      requesterEmail &&
      requesterEmail !== 'sistemas@dimer.com.mx' &&
      requesterEmail !== financeEmail
    ) {
      requesterApprovalCopy = requesterEmail;
    }
  }
'''
          if marker not in text:
              raise SystemExit('Expected effectiveReplyTo marker not found')
          text = text.replace(marker, addition, 1)

          old_send = """      to,
      subject,
      html,
    });"""
          new_send = """      to,
      cc: requesterApprovalCopy,
      subject,
      html,
    });"""
          if old_send not in text:
              raise SystemExit('Primary sendMail block not found')
          text = text.replace(old_send, new_send, 1)

          old_fallback = """        to,
        subject,
        html,
      });"""
          new_fallback = """        to,
        cc: requesterApprovalCopy,
        subject,
        html,
      });"""
          if old_fallback not in text:
              raise SystemExit('Fallback sendMail block not found')
          text = text.replace(old_fallback, new_fallback, 1)

          path.write_text(text, encoding='utf-8')
          print('Requester approval copy patch applied successfully.')

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/mailService.ts
          git rm .github/workflows/one-time-requester-copy.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: send approval copy to requester"
          git push
