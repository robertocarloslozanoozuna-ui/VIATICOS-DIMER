name: DIMER Vercel Bundle Repair

on:
  push:
    paths:
      - '.github/workflows/post-request-fix2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundled Vercel API
        run: npm run build

      - name: Verify bundle
        run: |
          test -s api/index.js
          grep -q "viaticos-dimer-api" api/index.js || true

      - name: Promote bundle
        run: |
          rm -f api/index.ts api/index.js.map
          rm -f server/app.js server/app.js.map
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/index.js api/index.ts api/index.js.map server/app.js server/app.js.map
          git diff --cached --check
          git diff --cached --quiet || git commit -m 'fix: deploy bundled Vercel serverless API'
          git push origin main
