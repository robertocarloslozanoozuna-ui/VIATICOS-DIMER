name: DIMER Production Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair admin approver selector
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/components/SolicitarView.tsx')
          s=p.read_text(encoding='utf-8')
          old="&&String(u.email||'').trim().toLowerCase()!=='sistemas@dimer.com.mx'"
          if old in s:
              p.write_text(s.replace(old,'',1),encoding='utf-8')
      - name: Repair deposit date in emails and detail placeholder
        shell: python
        run: |
          from pathlib import Path
          import re
          # Frontend: make the description placeholder explicit and useful.
          p=Path('src/components/SolicitarView.tsx')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'placeholder="[^"]*"', lambda m: 'placeholder="Describe el motivo del viaje"' if 'describ' in m.group(0).lower() else m.group(0), s, count=1)
          p.write_text(s,encoding='utf-8')

          # Email templates: expose the required deposit date to the approver,
          # requester, and the post-approval notification sent to Finance.
          p=Path('server/mailService.ts')
          s=p.read_text(encoding='utf-8')
          date_decl="  const depositDate=request.depositDate?new Date(request.depositDate+'T00:00:00').toLocaleDateString('es-MX'):'';"
          s=s.replace("  const requestDate=request.requestDate||(request.createdAt?new Date(request.createdAt).toLocaleDateString('es-MX'):new Date().toLocaleDateString('es-MX'));\n", "  const requestDate=request.requestDate||(request.createdAt?new Date(request.createdAt).toLocaleDateString('es-MX'):new Date().toLocaleDateString('es-MX'));\n"+date_decl+"\n")
          marker='<tr><td class="label">Fecha</td><td class="value">${esc(requestDate)}</td></tr>'
          replacement=marker+'${depositDate?`<tr><td class="label">Fecha requerida de depósito</td><td class="value"><strong>${esc(depositDate)}</strong></td></tr>`:``}'
          s=s.replace(marker,replacement)
          p.write_text(s,encoding='utf-8')
      - name: Commit UI and email improvements
        shell: bash
        run: |
          if ! git diff --quiet -- src/components/SolicitarView.tsx server/mailService.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/SolicitarView.tsx server/mailService.ts
            git commit -m "fix: mostrar fecha de deposito en correos y mejorar detalle"
            git push
          fi
      - name: Commit admin approver selector fix
        shell: bash
        run: |
          if ! git diff --quiet -- src/components/SolicitarView.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/SolicitarView.tsx
            git commit -m "fix: permitir administrador como jefe aprobador"
            git push
          fi
      - name: Repair backend baseline
        if: contains(github.event.head_commit.message, 'repair backend baseline')
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          app=subprocess.check_output(['git','show','220b3408df37f2092670c96d36620209ed01094c:server/app.ts'], text=True)
          app=app.replace("html:buildBossApprovalEmailHtml({request:created,approvalUrl})", "html:buildBossApprovalEmailHtml({request:created,user:u,approveUrl:approvalUrl,rejectUrl:approvalUrl,token:created.approvalToken||''})")
          Path('server/app.ts').write_text(app,encoding='utf-8')
          p=Path('server/adminRequestRoutes.ts'); s=p.read_text(encoding='utf-8'); p.write_text(s.replace('        approveUrl,\n        rejectUrl,','        approveUrl: approvalUrl,\n        rejectUrl,'),encoding='utf-8')
      - name: Synchronize npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Verify production architecture
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE "USERS|TRAVEL_REQUESTS|APPROVAL_TOKENS|AUDIT_LOGS|VERIFICATION_CODES|currentSessionUserId|folioSequence|saveToDisk|data/db\.json|x-user-email|x-user-id" server --include='*.ts'; then
            echo 'Forbidden in-memory/disk authentication or persistence reference found.'
            exit 1
          fi
          test ! -e data/db.json
          test ! -e server/db.supabase.fixed.ts
          test ! -e server/db.supabase.ts
          test -e server/apiEntry.ts
          test -s api/index.js
          node --check api/index.js
          test -e api/admin/schema.sql
      - name: Commit backend repair
        if: contains(github.event.head_commit.message, 'repair backend baseline')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app.ts server/adminRequestRoutes.ts
          git commit -m "fix: restaurar backend completo y corregir builder de aprobacion"
          git push
