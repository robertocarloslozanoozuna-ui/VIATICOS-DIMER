name: DIMER Production Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair admin approver selector
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/components/SolicitarView.tsx')
          s=p.read_text(encoding='utf-8')
          old="&&String(u.email||'').trim().toLowerCase()!=='sistemas@dimer.com.mx'"
          if old in s:
              p.write_text(s.replace(old,'',1),encoding='utf-8')
      - name: Commit admin approver selector fix
        shell: bash
        run: |
          if ! git diff --quiet -- src/components/SolicitarView.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/SolicitarView.tsx
            git commit -m "fix: permitir administrador como jefe aprobador"
            git push
          fi
      - name: Repair backend baseline
        if: contains(github.event.head_commit.message, 'repair backend baseline')
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          app=subprocess.check_output(['git','show','220b3408df37f2092670c96d36620209ed01094c:server/app.ts'], text=True)
          app=app.replace("html:buildBossApprovalEmailHtml({request:created,approvalUrl})", "html:buildBossApprovalEmailHtml({request:created,user:u,approveUrl:approvalUrl,rejectUrl:approvalUrl,token:created.approvalToken||''})")
          Path('server/app.ts').write_text(app,encoding='utf-8')
          p=Path('server/adminRequestRoutes.ts'); s=p.read_text(encoding='utf-8'); p.write_text(s.replace('        approveUrl,\n        rejectUrl,','        approveUrl: approvalUrl,\n        rejectUrl,'),encoding='utf-8')
      - name: Synchronize npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Verify production architecture
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE "USERS|TRAVEL_REQUESTS|APPROVAL_TOKENS|AUDIT_LOGS|VERIFICATION_CODES|currentSessionUserId|folioSequence|saveToDisk|data/db\.json|x-user-email|x-user-id" server --include='*.ts'; then
            echo 'Forbidden in-memory/disk authentication or persistence reference found.'
            exit 1
          fi
          test ! -e data/db.json
          test ! -e server/db.supabase.fixed.ts
          test ! -e server/db.supabase.ts
          test -e server/apiEntry.ts
          test -s api/index.js
          node --check api/index.js
          test -e api/admin/schema.sql
      - name: Commit backend repair
        if: contains(github.event.head_commit.message, 'repair backend baseline')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app.ts server/adminRequestRoutes.ts
          git commit -m "fix: restaurar backend completo y corregir builder de aprobacion"
          git push
