name: DIMER Production Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - name: Verify production architecture
        shell: bash
        run: |
          set -e
          if grep -R -nE "USERS|TRAVEL_REQUESTS|APPROVAL_TOKENS|AUDIT_LOGS|VERIFICATION_CODES|currentSessionUserId|folioSequence|saveToDisk|data/db\.json|x-user-email|x-user-id" server api --exclude='schema.sql'; then
            echo 'Forbidden in-memory/disk authentication or persistence reference found.'
            exit 1
          fi
          test ! -e data/db.json
          test ! -e server/db.supabase.fixed.ts
          test ! -e server/db.supabase.ts
          test ! -e server/apiEntry.ts
          test ! -e api/index.js
          test -e api/index.ts
          test -e api/admin/schema.sql
