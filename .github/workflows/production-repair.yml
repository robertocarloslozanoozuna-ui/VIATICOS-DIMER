name: DIMER Production Repair

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/production-repair.yml'

permissions:
  contents: write
  copilot-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Repair production architecture
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot --yolo -p 'Actúa como desarrollador senior responsable de producción. Trabaja DIRECTAMENTE sobre este repositorio y corrige el backend de VIATICOS DIMER para dejarlo realmente listo para Vercel + Supabase. NO generes un informe y NO pidas otra auditoría: modifica los archivos y deja el código funcionando.

          OBJETIVO INNEGOCIABLE:
          1. Supabase PostgreSQL debe ser la única fuente de verdad. Elimina del runtime toda persistencia/caché de negocio en RAM: USERS, TRAVEL_REQUESTS, APPROVAL_TOKENS, AUDIT_LOGS, DEPARTMENTS, BOSSES, ROLES, VERIFICATION_CODES, currentSessionUserId, folioSequence y cualquier seed/hydrate/saveToDisk basado en memoria.
          2. No uses data/db.json ni ningún fallback de disco.
          3. La identidad autenticada debe provenir exclusivamente de JWT firmado en cookie HttpOnly dimer_session o Authorization Bearer. Elimina x-user-email, x-user-id y switch-user como mecanismos de autenticación real.
          4. Todas las lecturas/escrituras de users, travel_requests, approval_tokens, audit_logs, departments, bosses y roles deben ser consultas Supabase.
          5. Registro/verificación: el código temporal debe persistir en Supabase, no Map. Si el esquema necesita una tabla para verification codes, créala idempotentemente en api/admin/schema.sql y úsala desde el servidor.
          6. Folios: usar exclusivamente RPC PostgreSQL generate_next_travel_folio(target_year), concurrency-safe por año mediante travel_folio_counters. Nunca contar filas ni incrementar una variable local.
          7. Aprobación/rechazo: usar exclusivamente RPC process_approval_token_action(p_token,p_action,p_amount_authorized,p_comments). La RPC debe consumir token, bloquear solicitud, validar expiración y estado, actualizar travel_requests y escribir audit_logs en una sola transacción ACID. El servidor sólo envía emails después de recibir éxito del RPC.
          8. IMPORTANTE: el esquema real de Supabase actualmente contiene columnas adicionales en travel_requests: approval_token, rejected_by, rejected_at, rejection_reason y updated_at. NO elimines datos existentes. Conserva compatibilidad con esas columnas y alinea el DDL con la base real.
          9. approval_tokens actualmente permite request_id, boss_id y boss_email NULL. Respeta el esquema real.
          10. No pongas secretos en código ni frontend.
          11. Mantén las rutas/API que el frontend actual utiliza. No rompas la UI. Si es necesario, adapta los controladores a funciones async reales.
          12. /api/health debe responder sin depender de datos seed. /api/diagnostic debe reportar database=supabase y nunca in-memory.
          13. Vercel debe usar un único entrypoint serverless api/index.ts importando createApp() desde server/app.ts. No generes artefactos api/index.js ni server/apiEntry.ts.
          14. Revisa package.json, vercel.json, server/supabase.ts, server/db.ts, server/app.ts y api/admin/schema.sql en conjunto.
          15. No inventes usuarios, solicitudes, tokens ni departamentos en cold start. Si Supabase está caído, devuelve un error controlado 503/500.
          16. Usa tipos TypeScript correctos y evita any innecesario.

          ESQUEMA REAL CONOCIDO:
          users: id,name,email,role,role_id,department,status,is_verified,password_hash,salt,created_at.
          approval_tokens: id,token,request_id,boss_id,boss_email,expires_at,used,created_at,used_at,action.
          audit_logs: id,request_id,user_id,user_name,user_email,action,details,created_at.
          travel_requests: id,folio,status,user_id,requester_name,department,request_type,detail,request_date,urgency,boss_id,boss_email,boss_name,start_date,end_date,destination,reason,amount_requested,amount_authorized,transport_cost,hotel_cost,food_cost,misc_cost,comments,approved_by,approved_at,created_at,approval_token,rejected_by,rejected_at,rejection_reason,updated_at.
          departments: id,name,description,active,created_at.
          bosses: id,name,email,department,active,created_at.
          roles: id,name,description,active,is_system,permissions,created_at.

          REALIZA EL TRABAJO:
          - inspecciona primero todos los archivos relevantes y el frontend para conocer los endpoints usados;
          - implementa la solución completa, no una simulación;
          - actualiza api/admin/schema.sql de forma idempotente y compatible con el esquema real;
          - elimina código muerto de memoria y artefactos obsoletos;
          - ejecuta npm install si es necesario;
          - ejecuta npm run lint y npm run build;
          - corrige todos los errores que aparezcan;
          - busca al final cualquier referencia a USERS, TRAVEL_REQUESTS, APPROVAL_TOKENS, AUDIT_LOGS, VERIFICATION_CODES, currentSessionUserId, folioSequence, saveToDisk, data/db.json y x-user-email/x-user-id/switch-user dentro del backend;
          - deja un cambio final limpio y coherente.

          NO hagas commit hasta que lint y build pasen. Cuando todo esté correcto, haz git add, git commit con mensaje "fix: production Supabase-only architecture" y git push origin main.'

      - name: Verify final repository state
        run: |
          git status --short
          git log -1 --oneline
