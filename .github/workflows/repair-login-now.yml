name: Repair login now
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch authentication robustness
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('server/db.ts'); s=p.read_text(encoding='utf-8')
          pattern=r"export async function resolveUserRoles\(u:StoredUserRecord\)\{.*?\nexport function sanitizeUser"
          replacement="""export async function resolveUserRoles(u:StoredUserRecord){const primaryRoleId=roleFallbackId(u.role,u.roleId);let roleIds:string[]=[];try{roleIds=await getUserRoleIds(u.id,primaryRoleId);}catch(error){console.error('[RBAC] No se pudieron resolver los roles del usuario:',error);roleIds=primaryRoleId?[primaryRoleId]:[];}let roles:RoleDefinition[]=[];try{roles=await getRolesByIds(roleIds);}catch(error){console.error('[RBAC] No se pudieron cargar las definiciones de roles:',error);}const activeRoles=roles.filter(r=>r.active);const hasAdmin=String(u.role||'').trim().toUpperCase()==='ADMIN'||String(u.role||'').trim().toUpperCase()==='ADMINISTRADOR'||String(u.roleId||'').trim().toLowerCase()==='role_admin'||roleIds.some(id=>String(id).trim().toLowerCase()==='role_admin')||activeRoles.some(r=>String(r.id).trim().toLowerCase()==='role_admin'||String(r.name).trim().toUpperCase()==='ADMIN'||String(r.name).trim().toUpperCase()==='ADMINISTRADOR');const permissions=hasAdmin?ALL_SYSTEM_PERMISSIONS.map(p=>p.id):Array.from(new Set(activeRoles.flatMap(r=>r.permissions)));return {roleIds,roles,permissions,primaryRoleId,hasAdmin};}\nexport function sanitizeUser"""
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('resolveUserRoles not found')
          old="export function hasPermission(u:User|undefined,p:Permission){return !!u&&u.status==='ACTIVO'&&(u.role==='ADMIN'||u.permissions?.includes(p));}"
          new="export function hasPermission(u:User|undefined,p:Permission){const isAdmin=!!u&&(String(u.role||'').trim().toUpperCase()==='ADMIN'||String(u.role||'').trim().toUpperCase()==='ADMINISTRADOR'||String(u.roleId||'').trim().toLowerCase()==='role_admin'||(Array.isArray(u.roleIds)&&u.roleIds.some(id=>String(id).trim().toLowerCase()==='role_admin'));return !!u&&u.status==='ACTIVO'&&(isAdmin||u.permissions?.includes(p));}"
          if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('server/app.ts'); s=p.read_text(encoding='utf-8')
          old="function err(res:express.Response,e:unknown){const msg=e instanceof Error?e.message:'Error interno';const status=/JWT|autentic|token inválido|no se encontró/i.test(msg)?400:503;return res.status(status).json({success:false,error:msg});}"
          new="function err(res:express.Response,e:unknown){const msg=e instanceof Error?e.message:(typeof e==='string'?e:(e&&typeof e==='object'?String((e as any).message||(e as any).error_description||(e as any).error||'Error interno'):'Error interno'));const status=/JWT|autentic|token inválido|no se encontró/i.test(msg)?400:503;console.error('[API-ERROR]',e);return res.status(status).json({success:false,error:msg});}"
          if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          for fn in ['src/components/LoginView.tsx','src/components/AuthModal.tsx']:
            p=Path(fn); s=p.read_text(encoding='utf-8')
            s=s.replace("setError(err.message || 'Error de conexión con el servidor');","setError(err instanceof Error ? err.message : (typeof err === 'string' ? err : String(err?.message || err?.error || 'Error de conexión con el servidor')));",1)
            s=s.replace("setError(err.message || 'Error al iniciar sesión');","setError(err instanceof Error ? err.message : (typeof err === 'string' ? err : String(err?.message || err?.error || 'Error al iniciar sesión')));",1)
            p.write_text(s,encoding='utf-8')

          Path('.github/workflows/fix-admin-login.yml').unlink(missing_ok=True)
          Path('.github/workflows/repair-login-now.yml').unlink(missing_ok=True)
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/db.ts server/app.ts src/components/LoginView.tsx src/components/AuthModal.tsx .github/workflows/fix-admin-login.yml .github/workflows/repair-login-now.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore global login and normalize errors"
          git push
