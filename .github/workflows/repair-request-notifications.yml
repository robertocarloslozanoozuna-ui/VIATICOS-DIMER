name: Repair request notifications

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch notification flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server/app.ts')
          s=p.read_text(encoding='utf-8')
          old="""app.post('/api/requests',requireAuth,async(req,res)=>{try{const u=(req as any).dimerUser as User;const body=req.body||{};const id=`req_${Date.now()}_${crypto.randomBytes(4).toString('hex')}`;const folio=await generateNextFolio();const request:TravelRequest={...body,id,folio,status:'PENDIENTE_APROBACION',userId:u.id,requesterName:u.name,department:u.department,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};const created=await insertRequest(request);await recordAuditLog({requestId:created.id,userId:u.id,action:'CREACION_SOLICITUD',details:{folio:created.folio,destination:created.destination,amountRequested:created.amountRequested}});if(created.approvalToken){try{const approvalUrl=`${baseUrl(req)}/api/approval/token-action?token=${encodeURIComponent(created.approvalToken)}`;await sendEmail({to:created.bossEmail,subject:`AUTORIZACIÓN DE VIÁTICOS - Folio ${created.folio}`,html:buildBossApprovalEmailHtml({request:created,user:u,approveUrl:approvalUrl,rejectUrl:approvalUrl,token:created.approvalToken||''})});}catch(e){console.error('Error enviando correo de aprobación:',e);}}res.json(created);}catch(e){err(res,e);}});"""
          new="""app.post('/api/requests',requireAuth,async(req,res)=>{try{const u=(req as any).dimerUser as User;const body=req.body||{};const id=`req_${Date.now()}_${crypto.randomBytes(4).toString('hex')}`;const folio=await generateNextFolio();const request:TravelRequest={...body,id,folio,status:'PENDIENTE_APROBACION',userId:u.id,requesterName:u.name,department:u.department,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};const created=await insertRequest(request);await recordAuditLog({requestId:created.id,userId:u.id,action:'CREACION_SOLICITUD',details:{folio:created.folio,destination:created.destination,amountRequested:created.amountRequested}});const notifications:{approval:any;requester:any}={approval:null,requester:null};const notificationErrors:string[]=[];if(!created.approvalToken){notificationErrors.push('La solicitud fue creada pero no tiene token de aprobación.');}else{const approvalUrl=`${baseUrl(req)}/api/approval/token-action?token=${encodeURIComponent(created.approvalToken)}`;try{notifications.approval=await sendEmail({to:created.bossEmail,subject:`AUTORIZACIÓN DE VIÁTICOS - Folio ${created.folio}`,html:buildBossApprovalEmailHtml({request:created,user:u,approveUrl:approvalUrl,rejectUrl:approvalUrl,token:created.approvalToken})});if(notifications.approval?.status==='FALLIDO')notificationErrors.push(`Correo al aprobador: ${notifications.approval.error||'fallo de envío SMTP'}`);}catch(e){const m=e instanceof Error?e.message:String(e);notificationErrors.push(`Correo al aprobador: ${m}`);console.error('[REQUEST-CREATE-APPROVAL-EMAIL]',e);}}const requesterEmail=String(u.email||'').trim().toLowerCase();if(!requesterEmail){notificationErrors.push('No se encontró correo electrónico del solicitante.');}else{try{notifications.requester=await sendEmail({to:requesterEmail,subject:`SOLICITUD DE VIÁTICOS REGISTRADA - Folio ${created.folio}`,html:buildRequesterConfirmationEmailHtml({request:created,user:u,bossName:String(created.bossName||created.bossEmail||'Supervisor'),bossEmail:String(created.bossEmail||'')})});if(notifications.requester?.status==='FALLIDO')notificationErrors.push(`Correo al solicitante: ${notifications.requester.error||'fallo de envío SMTP'}`);}catch(e){const m=e instanceof Error?e.message:String(e);notificationErrors.push(`Correo al solicitante: ${m}`);console.error('[REQUEST-CREATE-REQUESTER-EMAIL]',e);}}const emailOk=notificationErrors.length===0;res.status(emailOk?200:207).json({...created,notification:{ok:emailOk,errors:notificationErrors,approval:notifications.approval,requester:notifications.requester}});}catch(e){err(res,e);}});"""
          if old not in s:
              raise SystemExit('Expected /api/requests handler was not found; refusing to patch.')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          
          p=Path('src/components/SolicitarView.tsx')
          s=p.read_text(encoding='utf-8')
          old="""      setSuccessResult({request:createdRequest,approvalToken:createdRequest.approvalToken,automationJson:automationPayload});"""
          new="""      const notification = data?.notification;\n      if (notification && notification.ok === false) {\n        const details = Array.isArray(notification.errors) ? notification.errors.join(' | ') : 'No fue posible enviar las notificaciones.';\n        throw new Error(`La solicitud ${createdRequest.folio} fue guardada, pero falló el envío de correo: ${details}`);\n      }\n      setSuccessResult({request:createdRequest,approvalToken:createdRequest.approvalToken,mailResult:notification,automationJson:automationPayload});"""
          if old not in s:
              raise SystemExit('Expected successResult assignment was not found; refusing to patch.')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit repair and remove workflow
        run: |
          rm -f .github/workflows/repair-request-notifications.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app.ts src/components/SolicitarView.tsx .github/workflows/repair-request-notifications.yml
          git commit -m "fix: send request approval and confirmation emails" || exit 0
          git push
